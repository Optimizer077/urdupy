<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">UrduPy — اردو پائی</title>
  <desc id="desc">Write in Urdu, run on real CPython, use every Python library. Keyword chips show اگر = if, ہر = for, فنکشن = def, واپس = return, درآمد = import, دکھاؤ = print.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#053b2c"/>
      <stop offset="0.55" stop-color="#0b6e4f"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .latin { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .urdu-title { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", "Segoe UI", Tahoma, serif; }
      .urdu { font-family: "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>
  <!-- decorative rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <circle cx="1120" cy="40" r="90"/>
    <circle cx="1120" cy="40" r="140"/>
    <circle cx="40" cy="300" r="120"/>
  </g>

  <!-- Title block -->
  <text x="60" y="118" class="latin" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">UrduPy</text>
  <text x="330" y="118" class="urdu-title" font-size="48" fill="#fde68a">اردو پائی</text>
  <text x="62" y="166" class="latin" font-size="21" fill="#d1fae5">Urdu where you write your ideas.</text>
  <text x="62" y="194" class="latin" font-size="21" fill="#d1fae5">Python where your program runs.</text>

  <!-- Feature pills -->
  <g class="latin" font-size="14" font-weight="600">
    <rect x="60" y="226" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="135" y="248" text-anchor="middle" fill="#ffffff">Real CPython</text>
    <rect x="222" y="226" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="307" y="248" text-anchor="middle" fill="#ffffff">Zero core deps</text>
    <rect x="404" y="226" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.14"/>
    <text x="504" y="248" text-anchor="middle" fill="#ffffff">NumPy · OpenCV · PyTorch</text>
  </g>

  <!-- Keyword chips card -->
  <rect x="700" y="38" width="450" height="224" rx="16" fill="#03120d" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="724" cy="60" r="6" fill="#f87171"/>
  <circle cx="744" cy="60" r="6" fill="#fbbf24"/>
  <circle cx="764" cy="60" r="6" fill="#34d399"/>
  <text x="1130" y="65" text-anchor="end" class="mono" font-size="13" fill="#94a3b8">keywords.urdu</text>

  <g>
    <!-- row 1 -->
    <rect x="722" y="86" width="196" height="46" rx="10" fill="#0b6e4f" fill-opacity="0.55"/>
    <text x="780" y="116" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">اگر</text>
    <text x="840" y="115" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="856" y="115" class="mono" font-size="16" fill="#a7f3d0">if</text>

    <rect x="932" y="86" width="196" height="46" rx="10" fill="#0b6e4f" fill-opacity="0.55"/>
    <text x="990" y="116" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">ہر</text>
    <text x="1050" y="115" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="1066" y="115" class="mono" font-size="16" fill="#a7f3d0">for</text>

    <!-- row 2 -->
    <rect x="722" y="142" width="196" height="46" rx="10" fill="#0b6e4f" fill-opacity="0.55"/>
    <text x="780" y="172" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">فنکشن</text>
    <text x="840" y="171" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="856" y="171" class="mono" font-size="16" fill="#a7f3d0">def</text>

    <rect x="932" y="142" width="196" height="46" rx="10" fill="#0b6e4f" fill-opacity="0.55"/>
    <text x="990" y="172" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">واپس</text>
    <text x="1050" y="171" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="1066" y="171" class="mono" font-size="16" fill="#a7f3d0">return</text>

    <!-- row 3 -->
    <rect x="722" y="198" width="196" height="46" rx="10" fill="#0e7490" fill-opacity="0.55"/>
    <text x="780" y="228" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">درآمد</text>
    <text x="840" y="227" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="856" y="227" class="mono" font-size="16" fill="#a7f3d0">import</text>

    <rect x="932" y="198" width="196" height="46" rx="10" fill="#0e7490" fill-opacity="0.55"/>
    <text x="990" y="228" text-anchor="middle" class="urdu" font-size="22" fill="#fde68a">دکھاؤ</text>
    <text x="1050" y="227" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">=</text>
    <text x="1066" y="227" class="mono" font-size="16" fill="#a7f3d0">print</text>
  </g>
</svg>
