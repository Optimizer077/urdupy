<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">How UrduPy works</title>
  <desc id="desc">Block diagram. Entry points (CLI, Python API, import hook) feed the UrduPy frontend: read UTF-8, tokenize, translate keywords in context, build a source map, parse with CPython, compile to a code object. The code object executes in the real CPython interpreter with Urdu built-in aliases, and imports the user's installed libraries such as NumPy, OpenCV, PyTorch and Transformers unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6e4f"/>
    </marker>
    <style>
      .t { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .s { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #475569; }
      .m { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; fill: #0f172a; }
      .u { font-family: "Segoe UI", "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif; }
      .tag { font-family: "Cascadia Code", Consolas, Menlo, monospace; font-size: 11px; fill: #64748b; }
      .h { font-family: "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="790" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="52" class="t" font-size="26" font-weight="800">How UrduPy works</text>
  <text x="40" y="78" class="s" font-size="14">A thin Urdu frontend translates keywords, then hands an ordinary code object to the real CPython interpreter.</text>

  <!-- column headers -->
  <text x="40" y="122" class="h" fill="#7c3aed">1 · ENTRY POINTS</text>
  <text x="312" y="122" class="h" fill="#0b6e4f">2 · URDUPY FRONTEND  (pure Python, zero dependencies)</text>
  <text x="832" y="122" class="h" fill="#0e7490">3 · REAL CPYTHON</text>

  <!-- ============ Column 1: entry points ============ -->
  <g>
    <rect x="40" y="140" width="232" height="128" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="56" y="166" class="t" font-size="15" font-weight="700">Command line</text>
    <text x="56" y="190" class="m" font-size="12.5">urdupy run app.urdu</text>
    <text x="56" y="210" class="m" font-size="12.5">urdupy check *.urdu</text>
    <text x="56" y="230" class="m" font-size="12.5">urdupy translate app.urdu</text>
    <text x="56" y="250" class="m" font-size="12.5">urdupy repl</text>
    <text x="262" y="250" class="tag" text-anchor="end">cli.py · repl.py</text>

    <rect x="40" y="288" width="232" height="112" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="56" y="314" class="t" font-size="15" font-weight="700">Python API</text>
    <text x="56" y="338" class="m" font-size="12.5">execute_source(src)</text>
    <text x="56" y="358" class="m" font-size="12.5">compile_urdu(src)</text>
    <text x="56" y="378" class="m" font-size="12.5">translate(src)</text>
    <text x="262" y="314" class="tag" text-anchor="end">runtime.py</text>

    <rect x="40" y="420" width="232" height="132" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="56" y="446" class="t" font-size="15" font-weight="700">Import hook</text>
    <text x="56" y="470" class="m" font-size="12.5">with install_importer():</text>
    <text x="56" y="490" class="m" font-size="12.5" xml:space="preserve">    import my_module</text>
    <text x="56" y="516" class="s" font-size="12">finds my_module.urdu or a</text>
    <text x="56" y="534" class="s" font-size="12">package with __init__.urdu</text>
    <text x="262" y="446" class="tag" text-anchor="end">importer.py</text>

    <text x="40" y="584" class="s" font-size="12">Python .py files and .urdu files</text>
    <text x="40" y="601" class="s" font-size="12">can import each other.</text>
  </g>

  <!-- arrows col1 -> col2 -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <path d="M272,204 H306" marker-end="url(#arrow)"/>
    <path d="M272,344 H306" marker-end="url(#arrow)"/>
    <path d="M272,486 H306" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ Column 2: frontend ============ -->
  <rect x="310" y="140" width="484" height="492" rx="14" fill="#f0fdf4" stroke="#0b6e4f" stroke-width="1.5"/>

  <!-- step boxes -->
  <g>
    <rect x="330" y="158" width="336" height="62" rx="10" fill="#ffffff" stroke="#86efac"/>
    <circle cx="352" cy="189" r="12" fill="#0b6e4f"/><text x="352" y="194" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#ffffff" style="fill:#ffffff">1</text>
    <text x="374" y="184" class="t" font-size="14.5" font-weight="700">Read UTF-8 source</text>
    <text x="374" y="204" class="s" font-size="12">BOM accepted · CRLF kept · nothing rewritten</text>

    <rect x="330" y="234" width="336" height="62" rx="10" fill="#ffffff" stroke="#86efac"/>
    <circle cx="352" cy="265" r="12" fill="#0b6e4f"/><text x="352" y="270" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#ffffff">2</text>
    <text x="374" y="260" class="t" font-size="14.5" font-weight="700">Tokenize</text>
    <text x="374" y="280" class="s" font-size="12">stdlib tokenize · strings and comments untouched</text>

    <rect x="330" y="310" width="336" height="90" rx="10" fill="#ffffff" stroke="#0b6e4f" stroke-width="1.5"/>
    <circle cx="352" cy="341" r="12" fill="#0b6e4f"/><text x="352" y="346" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#ffffff">3</text>
    <text x="374" y="336" class="t" font-size="14.5" font-weight="700">Translate keywords in context</text>
    <!-- chips: Urdu and English in separate text runs -->
    <rect x="374" y="348" width="70" height="24" rx="6" fill="#dcfce7"/>
    <text x="395" y="366" text-anchor="middle" class="u" font-size="15" fill="#065f46">اگر</text>
    <text x="428" y="365" text-anchor="middle" class="m" font-size="11.5">if</text>
    <rect x="450" y="348" width="70" height="24" rx="6" fill="#dcfce7"/>
    <text x="469" y="366" text-anchor="middle" class="u" font-size="15" fill="#065f46">ہر</text>
    <text x="501" y="365" text-anchor="middle" class="m" font-size="11.5">for</text>
    <rect x="526" y="348" width="118" height="24" rx="6" fill="#dcfce7"/>
    <text x="560" y="366" text-anchor="middle" class="u" font-size="15" fill="#065f46">واپس</text>
    <text x="614" y="365" text-anchor="middle" class="m" font-size="11.5">return</text>
    <text x="374" y="390" class="s" font-size="11.5">keeps obj.attributes, f(label=…), imported names</text>

    <rect x="330" y="414" width="336" height="62" rx="10" fill="#ffffff" stroke="#86efac"/>
    <circle cx="352" cy="445" r="12" fill="#0b6e4f"/><text x="352" y="450" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#ffffff">4</text>
    <text x="374" y="440" class="t" font-size="14.5" font-weight="700">Source map</text>
    <text x="374" y="460" class="s" font-size="12">each edit records Urdu span ↔ Python span</text>

    <rect x="330" y="490" width="336" height="62" rx="10" fill="#ffffff" stroke="#86efac"/>
    <circle cx="352" cy="521" r="12" fill="#0b6e4f"/><text x="352" y="526" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#ffffff">5</text>
    <text x="374" y="516" class="t" font-size="14.5" font-weight="700">CPython parse + checks</text>
    <text x="374" y="536" class="s" font-size="12">reserved-word check · AST lines → Urdu source</text>

    <rect x="330" y="566" width="336" height="52" rx="10" fill="#0b6e4f"/>
    <circle cx="352" cy="592" r="12" fill="#ffffff"/><text x="352" y="597" text-anchor="middle" class="t" font-size="13" font-weight="700" style="fill:#0b6e4f">6</text>
    <text x="374" y="597" class="t" font-size="14.5" font-weight="700" style="fill:#ffffff">compile()  →  code object</text>
  </g>

  <!-- step arrows -->
  <g stroke="#0b6e4f" stroke-width="2" fill="none">
    <path d="M498,220 V232" marker-end="url(#arrowG)"/>
    <path d="M498,296 V308" marker-end="url(#arrowG)"/>
    <path d="M498,400 V412" marker-end="url(#arrowG)"/>
    <path d="M498,476 V488" marker-end="url(#arrowG)"/>
    <path d="M498,552 V564" marker-end="url(#arrowG)"/>
  </g>

  <!-- lexicon side box -->
  <rect x="682" y="296" width="98" height="124" rx="10" fill="#fefce8" stroke="#facc15"/>
  <text x="731" y="318" text-anchor="middle" class="m" font-size="12" font-weight="700">lexicon.py</text>
  <text x="731" y="346" text-anchor="middle" class="t" font-size="12.5"><tspan font-weight="700">35</tspan> keywords</text>
  <text x="731" y="370" text-anchor="middle" class="t" font-size="12.5"><tspan font-weight="700">2</tspan> contextual</text>
  <text x="731" y="394" text-anchor="middle" class="t" font-size="12.5"><tspan font-weight="700">15</tspan> aliases</text>
  <path d="M682,356 H670" stroke="#ca8a04" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="682" y="186" class="tag">runtime.py</text>
  <text x="682" y="262" class="tag">compiler.py</text>
  <text x="682" y="446" class="tag">source_map.py</text>
  <text x="682" y="522" class="tag">compiler.py</text>

  <!-- step 6 -> execute -->
  <path d="M666,592 H806 V214 H828" stroke="#0b6e4f" stroke-width="2.5" fill="none" marker-end="url(#arrowG)"/>
  <text x="826" y="420" class="s" font-size="11" transform="rotate(-90 826 420)" text-anchor="middle">ordinary code object</text>

  <!-- ============ Column 3: CPython ============ -->
  <g>
    <rect x="832" y="140" width="328" height="164" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="848" y="166" class="t" font-size="15" font-weight="700">Execute</text>
    <text x="1150" y="166" class="tag" text-anchor="end">runtime.py</text>
    <text x="848" y="190" class="m" font-size="12.5">exec(code, namespace)</text>
    <text x="848" y="214" class="s" font-size="12">__builtins__ copy + 15 Urdu aliases:</text>
    <rect x="848" y="224" width="140" height="26" rx="6" fill="#cffafe"/>
    <text x="882" y="243" text-anchor="middle" class="u" font-size="15" fill="#155e75">دکھاؤ</text>
    <text x="945" y="242" text-anchor="middle" class="m" font-size="11.5">is print</text>
    <rect x="996" y="224" width="140" height="26" rx="6" fill="#cffafe"/>
    <text x="1026" y="243" text-anchor="middle" class="u" font-size="15" fill="#155e75">حد</text>
    <text x="1090" y="242" text-anchor="middle" class="m" font-size="11.5">is range</text>
    <text x="848" y="276" class="s" font-size="12">tracebacks show your original Urdu lines</text>
    <text x="848" y="293" class="s" font-size="12">(linecache) · sys state restored afterwards</text>

    <rect x="832" y="324" width="328" height="98" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="848" y="350" class="t" font-size="15" font-weight="700">CPython interpreter</text>
    <text x="848" y="374" class="s" font-size="12">same process · same objects · same exceptions</text>
    <text x="848" y="394" class="s" font-size="12">standard sys.path search; Python modules keep</text>
    <text x="848" y="411" class="s" font-size="12">priority over same-named .urdu files</text>

    <rect x="832" y="442" width="328" height="190" rx="12" fill="#0e7490"/>
    <text x="848" y="468" class="t" font-size="15" font-weight="700" style="fill:#ffffff">Your installed libraries</text>
    <text x="848" y="488" class="s" font-size="12" style="fill:#cffafe">imported unchanged from the active environment</text>
    <g class="m" font-size="12.5">
      <rect x="848" y="502" width="92" height="28" rx="14" fill="#ffffff"/><text x="894" y="521" text-anchor="middle">stdlib</text>
      <rect x="948" y="502" width="92" height="28" rx="14" fill="#ffffff"/><text x="994" y="521" text-anchor="middle">numpy</text>
      <rect x="1048" y="502" width="96" height="28" rx="14" fill="#ffffff"/><text x="1096" y="521" text-anchor="middle">cv2</text>
      <rect x="848" y="538" width="92" height="28" rx="14" fill="#ffffff"/><text x="894" y="557" text-anchor="middle">torch</text>
      <rect x="948" y="538" width="196" height="28" rx="14" fill="#ffffff"/><text x="1046" y="557" text-anchor="middle">torchvision · transformers</text>
      <rect x="848" y="574" width="296" height="28" rx="14" fill="#ffffff" fill-opacity="0.85"/><text x="996" y="593" text-anchor="middle">pandas · fastapi · any pip package</text>
    </g>
    <text x="848" y="622" class="s" font-size="11.5" style="fill:#cffafe">CPU or CUDA: whatever build you installed</text>
  </g>
  <g stroke="#0e7490" stroke-width="2" fill="none">
    <path d="M996,304 V322" marker-end="url(#arrow)"/>
    <path d="M996,422 V440" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ Bottom: worked example ============ -->
  <rect x="40" y="656" width="1120" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="684" class="h" fill="#334155">EXAMPLE · ONE IMPORT LINE</text>

  <rect x="60" y="698" width="200" height="40" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="112" y="724" text-anchor="middle" class="u" font-size="18" fill="#065f46">درآمد</text>
  <text x="196" y="723" text-anchor="middle" class="m" font-size="14">torch</text>
  <path d="M262,718 H296" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="698" width="180" height="40" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="390" y="723" text-anchor="middle" class="m" font-size="14">import torch</text>
  <path d="M482,718 H516" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="698" width="320" height="40" rx="8" fill="#0e7490"/>
  <text x="680" y="723" text-anchor="middle" class="s" font-size="13" style="fill:#ffffff">real torch from site-packages (your venv)</text>

  <text x="864" y="714" class="s" font-size="12">Library names never change:</text>
  <text x="864" y="732" class="m" font-size="12">torch.nn.Module · forward · cv2.cvtColor</text>
</svg>
